<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KADİRLİ PASAM DONER PREMİUM LEZZET</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            margin-top: 20px;
        }
        
        .header {
            text-align: center;
            padding: 25px 20px;
            background: linear-gradient(to right, #8B0000, #B22222);
            color: white;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .image-container {
            height: 30vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .image-frame {
            width: 100%;
            height: 100%;
            border: 8px solid #8B0000;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f8f8;
            position: relative;
        }
        
        .image-frame::before {
            content: "";
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border: 2px solid #FFD700;
            border-radius: 20px;
            z-index: -1;
        }
        
        .image-frame img {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
        }
        
      
        
        .button-container {
            padding: 30px 20px;
            text-align: center;
        }
        
        .order-btn {
            background: linear-gradient(to right, #8B0000, #B22222);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(139, 0, 0, 0.4);
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }
        
        .order-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(139, 0, 0, 0.5);
            background: linear-gradient(to right, #B22222, #8B0000);
        }
        
        .order-btn:active {
            transform: translateY(0);
        }
        
        .social-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 30px 20px;
            background-color: #f8f8f8;
            border-top: 1px solid #e0e0e0;
        }
        
        .social-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #333;
            transition: all 0.3s ease;
        }
        
        .social-icon:hover {
            transform: translateY(-5px);
            color: #8B0000;
        }
        
        .icon-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8B0000, #B22222);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .icon-circle i {
            font-size: 30px;
            color: white;
        }
        
        .social-text {
            font-weight: 600;
            font-size: 1rem;
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 0.9rem;
            margin-top: 20px;
        }
        
        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8rem;
            }
            
            .order-btn {
                padding: 15px 40px;
                font-size: 1.3rem;
            }
            
            .social-container {
                gap: 20px;
            }
            
            .icon-circle {
                width: 60px;
                height: 60px;
            }
            
            .icon-circle i {
                font-size: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>KADİRLİ PAŞAM DÖNER</h1>
            <p>PREMIUM LEZZET</p>
        </div>
        
        <div class="image-container">
            <div class="image-frame">
               <img src="ff.jpg" alt="" />
                <div class="placeholder-image">
                    
                </div>
            </div>
        </div>
        
        <div class="button-container">
            <button class="order-btn" id="orderButton">SİPARİŞ VER</button>
        </div>
        
        <div class="social-container">
            <a href="https://www.instagram.com/kadirli_pasam_doner?igsh=c3gzZzIyYmk1cThp" class="social-icon" target="_blank">
                <div class="icon-circle">
                    <i class="fab fa-instagram"></i>
                </div>
                <span class="social-text">Instagram</span>
            </a>
            
            <a href="tel:05557918718" class="social-icon">
                <div class="icon-circle">
                    <i class="fas fa-phone"></i>
                </div>
                <span class="social-text">Telefon</span>
            </a>
        </div>
    </div>
    
    <div class="footer">
        
    </div>

    <script>
        document.getElementById('orderButton').addEventListener('click', function() {
            window.location.href = 'https://mektepiq1.github.io/pa-am-doner/p15.html';
        });
    </script>
</body>
</html>
